    <button style="min-height:48px;border:0;background:transparent;color:var(--label2);font-size:11px;line-height:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16 16 L21 21"/><path d="M8 11 l2 2 l4 -4"/></svg>점검</button>
